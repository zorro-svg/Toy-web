<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toy Haven - Checkout</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.svg">

</head>

<body>


    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            🧸 Toy Haven
        </div>

        <button class="menu-button" id="menuButton">
            ☰
        </button>

        <ul class="nav-links" id="navLinks">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="products.html">Shop</a>
            </li>

            <li>
                <a href="wishlist.html">
                    Collection <span id="collectionCount">0</span>
                </a>
            </li>

            <li>
                <a href="cart.html">
                    Cart 🛒 <span id="cartCount">0</span>
                </a>
            </li>

            <li>
                <a href="support.html">Support</a>
            </li>

        </ul>

    </nav>


    <section class="page-banner">

        <h1>Checkout 💳</h1>

        <p>Complete your order.</p>

    </section>


    <main class="checkout-container">


        <!-- Checkout Form -->
        <form id="checkoutForm" class="form-card">

            <h2>Delivery Details</h2>


            <label>
                Full Name
            </label>

            <input
                type="text"
                id="fullName"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                required
            >


            <label>
                Delivery Address
            </label>

            <textarea
                id="address"
                rows="4"
                required>
            </textarea>


            <label>
                Payment Method
            </label>

            <select
                id="paymentMethod"
                required>

                <option value="">
                    Select Payment Method
                </option>

                <option value="Card">
                    Card
                </option>

                <option value="Cash on Delivery">
                    Cash on Delivery
                </option>

            </select>


            <button
                type="submit"
                class="button">
                Confirm Order
            </button>

        </form>


        <!-- Order Summary -->
        <div class="form-card">

            <h2>Order Summary</h2>

            <div id="checkoutSummary"></div>

            <h3>
                Total:
                <span id="checkoutTotal">
                    Rs. 0
                </span>
            </h3>

        </div>


        <!-- Success -->
        <div
            id="checkoutSuccess"
            class="success-box">

            <div class="success-icon">
                🎉
            </div>

            <h2>Order Successful!</h2>

            <p>
                Thank you for shopping with Toy Haven.
            </p>

            <a
                href="index.html"
                class="button">
                Back to Home
            </a>

        </div>

    </main>


    <div id="toast"></div>


    <script src="script.js"></script>

</body>

</html>
